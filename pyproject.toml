[project]
name = "diplomski"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jordan Dinic", email = "jordan.dinic@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.0",
    "google-genai>=2.21.0",
    "langchain-core>=1.5.3",
    "markdownify>=1.2.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=5.0.0",
    "unstructured[pdf]>=0.18.0",
]

[project.scripts]
diplomski = "diplomski:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
